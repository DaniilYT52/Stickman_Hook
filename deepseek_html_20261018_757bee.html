<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b1e">
<title>Hook Swing</title>
<style>
  :root{
    --ui-bg: rgba(30,44,84,.85); --ui-bg-2: rgba(18,14,40,.96);
    --ui-text: #cfe4ff; --ui-text-dim: #93a7cc;
    --ui-border: rgba(120,190,255,.28);
    --ui-accent: #66c8ff; --ui-accent-2: #42c9a3;
    --ui-shadow: rgba(0,0,0,.6);
    --ui-hud-text: #dfe9ff; --ui-hud-shadow: rgba(0,0,0,.7);
    --ui-gem: #ffd166;
  }
  body.theme-classic{
    --ui-bg: rgba(255,255,255,.92); --ui-bg-2: rgba(245,250,255,.98);
    --ui-text: #1a2a3e; --ui-text-dim: #5a6b80;
    --ui-border: rgba(0,0,0,.15);
    --ui-accent: #3498db; --ui-accent-2: #27ae60;
    --ui-shadow: rgba(40,60,90,.25);
    --ui-hud-text: #1a2a3e; --ui-hud-shadow: rgba(255,255,255,.7);
    --ui-gem: #e67e22;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  body{background:#080b1e;transition:background .4s}
  body.theme-classic{background:#d8ecff}
  #game{display:block;position:fixed;inset:0;touch-action:none}

  #hud{position:fixed;inset:0;pointer-events:none;color:var(--ui-hud-text);
       text-shadow:0 2px 12px var(--ui-hud-shadow);z-index:5}
  .top{position:absolute;top:calc(12px + env(safe-area-inset-top));
    left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:12px}
  .lvlbox{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
  #modeBadge{font-size:15px}
  #lvlNum{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--ui-accent);
    background:var(--ui-bg);padding:4px 9px;border-radius:8px;
    border:1px solid var(--ui-border)}
  #lvlName{font-size:15px;font-weight:700;color:var(--ui-hud-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gemsHud{font-size:13px;font-weight:800;color:var(--ui-gem);
    background:rgba(255,209,102,.12);padding:4px 9px;border-radius:8px;
    border:1px solid rgba(255,209,102,.3)}
  #pauseBtn{pointer-events:auto;width:42px;height:42px;flex:0 0 42px;border:none;
    border-radius:12px;background:var(--ui-bg);border:1px solid var(--ui-border);
    color:var(--ui-text);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s;backdrop-filter:blur(8px)}
  #pauseBtn:active{transform:scale(.92)}
  #pauseBtn svg{width:16px;height:16px;fill:currentColor}
  .barWrap{position:absolute;top:calc(66px + env(safe-area-inset-top));
    left:16px;right:16px;height:5px;border-radius:3px;
    background:rgba(128,128,128,.15);overflow:hidden}
  #barFill{height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,var(--ui-accent-2),var(--ui-accent));
    transition:width .12s linear}
  #hint{position:absolute;bottom:calc(104px + env(safe-area-inset-bottom));
    left:0;right:0;text-align:center;font-size:13px;font-weight:600;
    opacity:.7;transition:opacity .6s;padding:0 96px;line-height:1.4;
    color:var(--ui-hud-text)}
  #hint.hide{opacity:0}

  #freezeBtn{position:absolute;left:calc(16px + env(safe-area-inset-left));
    bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:66px;
    border-radius:50%;pointer-events:auto;border:none;cursor:pointer;padding:0;
    background:conic-gradient(#7fe8ff 360deg, rgba(255,255,255,.10) 0deg);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s,opacity .2s,box-shadow .2s;
    box-shadow:0 0 0 2px rgba(10,20,40,.9),0 8px 24px rgba(0,0,0,.5)}
  #freezeBtn::after{content:'';position:absolute;inset:5px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#20406e,#0e1a33 75%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  #freezeBtn span{position:relative;z-index:1;font-size:26px;line-height:1;
    color:#a8ecff;filter:drop-shadow(0 0 6px rgba(120,230,255,.9))}
  #freezeBtn.on{transform:scale(.94);
    box-shadow:0 0 0 2px rgba(120,230,255,.6),0 0 34px rgba(120,230,255,.65)}
  #freezeBtn.on span{color:#fff;transform:scale(1.12)}
  #freezeBtn.dim{opacity:.35}
  #skipBtn{position:absolute;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(20px + env(safe-area-inset-bottom));width:70px;height:70px;
    border-radius:50%;pointer-events:auto;cursor:pointer;padding:0;
    background:radial-gradient(circle at 35% 30%,#ffe08a,#e67e22 90%);
    border:2px solid rgba(255,255,255,.55);color:#2a1400;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;line-height:1;
    box-shadow:0 0 0 2px rgba(10,20,40,.9),0 8px 24px rgba(230,126,34,.5);
    transition:transform .12s,opacity .2s,filter .15s}
  #skipBtn .icon{font-size:17px;margin-bottom:2px}
  #skipBtn .cost{font-size:12px}
  #skipBtn:active{transform:scale(.92);filter:brightness(1.1)}
  #skipBtn.disabled{opacity:.35;filter:grayscale(.6);cursor:not-allowed}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,9,22,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transition:opacity .32s;z-index:20;
    padding:20px;overflow-y:auto}
  body.theme-classic .overlay{background:rgba(200,225,255,.72)}
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{text-align:center;padding:24px 22px;border-radius:24px;max-width:480px;width:100%;
    background:linear-gradient(160deg,var(--ui-bg),var(--ui-bg-2));
    border:1px solid var(--ui-border);
    box-shadow:0 24px 80px var(--ui-shadow),inset 0 1px 0 rgba(255,255,255,.08);
    transform:scale(.92) translateY(10px);
    transition:transform .38s cubic-bezier(.2,1.3,.4,1),background .4s}
  .overlay.show .panel{transform:scale(1) translateY(0)}
  .panel h1{margin-bottom:4px;font-size:30px;font-weight:900;
    background:linear-gradient(90deg,#7ef0c0,#66c8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  body.theme-classic .panel h1{background:linear-gradient(90deg,#2980b9,#27ae60);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .panel h2{font-size:22px;margin-bottom:6px;
    background:linear-gradient(90deg,#7ef0c0,#66c8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  body.theme-classic .panel h2{background:linear-gradient(90deg,#2980b9,#27ae60);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .panel p{color:var(--ui-text-dim);font-size:13px;margin-bottom:14px;line-height:1.5}

  .btn{display:block;width:100%;font:inherit;font-weight:700;font-size:14px;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    padding:12px 18px;border:none;border-radius:13px;margin-bottom:8px;
    color:#04121e;background:linear-gradient(180deg,#8ef0c8,#42c9a3);
    box-shadow:0 8px 22px rgba(66,201,163,.32);
    transition:transform .13s,filter .13s}
  body.theme-classic .btn{background:linear-gradient(180deg,#54b3e8,#2980b9);
    color:#fff;box-shadow:0 8px 22px rgba(41,128,185,.32)}
  .btn:active{transform:translateY(2px) scale(.985);filter:brightness(.95)}
  .btn.ghost{background:rgba(128,128,128,.12);color:var(--ui-text);
    border:1px solid var(--ui-border);box-shadow:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.danger{background:linear-gradient(180deg,#ff8080,#cc3333);color:#fff}

  .theme-row{display:flex;gap:8px;margin-bottom:10px}
  .theme-btn{flex:1;font:inherit;font-weight:700;font-size:12px;cursor:pointer;
    padding:10px 6px;border-radius:11px;background:var(--ui-bg);
    border:1px solid var(--ui-border);color:var(--ui-text);
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .theme-btn.active{background:var(--ui-accent);color:#04121e;border-color:transparent}
  body.theme-classic .theme-btn.active{background:#2980b9;color:#fff}
  .swatch{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.2)}
  .swatch-neon{background:linear-gradient(135deg,#070a1c,#66c8ff 70%,#c792ff)}
  .swatch-classic{background:linear-gradient(135deg,#fff,#d4e8ff 70%,#2980b9);border-color:#2980b9}

  .mode-tabs,.shop-tabs{display:flex;gap:6px;margin-bottom:10px}
  .mode-tab,.shop-tab{flex:1;font:inherit;font-weight:800;font-size:12px;
    cursor:pointer;padding:10px 4px;border-radius:11px;
    background:rgba(128,128,128,.10);border:1px solid var(--ui-border);
    color:var(--ui-text);transition:all .15s;text-transform:uppercase}
  .mode-tab.active,.shop-tab.active{background:var(--ui-accent);color:#04121e;
    border-color:transparent}
  body.theme-classic .mode-tab.active,
  body.theme-classic .shop-tab.active{background:#2980b9;color:#fff}
  .mode-tab[data-mode="lava"].active{background:linear-gradient(180deg,#ff8e6e,#e74c3c);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px;
    max-height:30vh;overflow-y:auto;padding:2px}
  @media (max-width:380px){ .grid{grid-template-columns:repeat(4,1fr)} }
  .grid button{font:inherit;font-weight:800;font-size:12px;padding:9px 0;
    border-radius:9px;cursor:pointer;color:var(--ui-text);position:relative;
    background:rgba(128,128,128,.10);border:1px solid var(--ui-border)}
  .grid button.cur{background:linear-gradient(180deg,#8ef0c8,#42c9a3);color:#04121e;
    border-color:transparent}
  body.theme-classic .grid button.cur{background:linear-gradient(180deg,#54b3e8,#2980b9);color:#fff}
  .grid button.done{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.4)}
  .grid button.locked{opacity:.35;cursor:not-allowed}
  .grid button.locked::after{content:'🔒';position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);font-size:15px;opacity:.9}
  .grid button.locked span{opacity:0}
  .grid button .st{position:absolute;bottom:0;left:0;right:0;
    font-size:7px;letter-spacing:.5px;color:var(--ui-gem);line-height:1}

  .stars{font-size:32px;letter-spacing:8px;margin:4px 0 10px;
    color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.6);height:38px}
  .stars span{display:inline-block;opacity:0;transform:scale(.3) rotate(-30deg);
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
  .stars span:nth-child(2){animation-delay:.14s}
  .stars span:nth-child(3){animation-delay:.28s}
  @keyframes pop{to{opacity:1;transform:scale(1) rotate(0)}}
  #winGems{margin-bottom:12px;font-size:14px;font-weight:700}

  #shop{z-index:22}
  #shopGemsWrap{display:flex;justify-content:center;align-items:center;gap:6px;
    margin-bottom:12px;font-size:18px;font-weight:800;color:var(--ui-gem)}

  .item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
    max-height:42vh;overflow-y:auto;padding:4px}
  @media (max-width:380px){ .item-grid{grid-template-columns:repeat(2,1fr)} }
  .item{background:rgba(128,128,128,.08);border:1px solid var(--ui-border);
    border-radius:11px;padding:6px;cursor:pointer;text-align:center;
    transition:transform .12s,background .15s}
  .item:hover{background:rgba(128,128,128,.16)}
  .item:active{transform:scale(.95)}
  .item.equipped{border-color:var(--ui-accent-2);
    box-shadow:0 0 0 2px var(--ui-accent-2) inset}
  .item-preview{height:40px;border-radius:6px;margin-bottom:5px;position:relative;
    box-shadow:inset 0 0 10px rgba(0,0,0,.3)}
  .item-check{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:22px;font-weight:900;
    text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .item-name{font-size:11px;font-weight:700;color:var(--ui-text);margin-bottom:1px}
  .item-action{font-size:10px;color:var(--ui-text-dim);font-weight:600}

  /* настройки */
  #settings{z-index:23}
  .setting-row{display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:9px 0;border-bottom:1px solid var(--ui-border)}
  .setting-row:last-of-type{border-bottom:none}
  .setting-row label{font-size:13px;font-weight:700;color:var(--ui-text);flex:0 0 auto}
  .setting-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .setting-btn{font:inherit;font-weight:700;font-size:11px;cursor:pointer;
    padding:6px 9px;border-radius:8px;background:rgba(128,128,128,.12);
    border:1px solid var(--ui-border);color:var(--ui-text);transition:all .15s;
    min-width:36px}
  .setting-btn.active{background:var(--ui-accent);color:#04121e;border-color:transparent}
  body.theme-classic .setting-btn.active{background:#2980b9;color:#fff}

  .skip-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
  .skip-grid .btn{margin:0;padding:10px;font-size:12px;text-transform:none;
    letter-spacing:.02em;line-height:1.3}
  .skip-grid .btn small{font-size:10px;opacity:.85;font-weight:600}

  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
    background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:12px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .25s;z-index:50;backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.15);text-align:center;max-width:80vw}
</style>
</head>
<body class="theme-neon">
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="lvlbox">
      <span id="modeBadge">🔥</span>
      <span id="lvlNum">01</span>
      <span id="lvlName">Первый шаг</span>
      <span id="gemsHud">💎 0</span>
    </div>
    <button id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1.2"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.2"/></svg>
    </button>
  </div>
  <div class="barWrap"><div id="barFill"></div></div>
  <div id="hint">Зажми экран — зацепиться. Отпусти — лететь. ❄ — замереть.</div>
  <button id="freezeBtn" aria-label="Freeze"><span>❄</span></button>
  <button id="skipBtn" aria-label="Skip">
    <span class="icon">⏭</span><span class="cost">50💎</span>
  </button>
</div>

<!-- MENU -->
<div id="menu" class="overlay show">
  <div class="panel">
    <h1>HOOK SWING</h1>
    <p data-i18n="menuSub">30 обычных · 12 лавовых · кастомизация</p>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="normal" data-i18n="normal">Обычные</button>
      <button class="mode-tab" data-mode="lava" data-i18n="lava">Лава</button>
    </div>
    <button class="btn" id="playBtn" data-i18n="play">Играть</button>
    <button class="btn ghost" id="shopBtnMenu" data-i18n="shop">Магазин</button>
    <button class="btn ghost" id="settingsBtnMenu" data-i18n="settings">Настройки</button>
    <div class="grid" id="menuGrid"></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pause" class="overlay">
  <div class="panel">
    <h2 data-i18n="paused">Пауза</h2>
    <div class="mode-tabs">
      <button class="mode-tab" data-mode="normal" data-i18n="normal">Обычные</button>
      <button class="mode-tab" data-mode="lava" data-i18n="lava">Лава</button>
    </div>
    <button class="btn" data-act="resume" data-i18n="continue">Продолжить</button>
    <button class="btn ghost" data-act="shop" data-i18n="shop">Магазин</button>
    <button class="btn ghost" data-act="settings" data-i18n="settings">Настройки</button>
    <button class="btn ghost" data-act="restart" data-i18n="restart">Начать заново</button>
    <button class="btn ghost" data-act="menu" data-i18n="toMenu">В меню</button>
    <div class="grid" id="pauseGrid"></div>
  </div>
</div>

<!-- WIN -->
<div id="win" class="overlay">
  <div class="panel">
    <h2 id="winTitle">Уровень пройден!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winGems"></p>
    <button class="btn" id="nextBtn" data-i18n="next">Далее</button>
    <button class="btn ghost" id="againBtn" data-i18n="again">Ещё раз</button>
    <button class="btn ghost" id="shopBtnWin" data-i18n="shop">Магазин</button>
    <button class="btn ghost" id="menuBtn" data-i18n="toMenu">В меню</button>
  </div>
</div>

<!-- SHOP -->
<div id="shop" class="overlay">
  <div class="panel">
    <h2 data-i18n="shop">Магазин</h2>
    <div id="shopGemsWrap">💎 <span id="shopGems">0</span></div>
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="tails" data-i18n="tails">Хвосты</button>
      <button class="shop-tab" data-tab="skins" data-i18n="skins">Скины</button>
      <button class="shop-tab" data-tab="hats" data-i18n="hats">Шляпы</button>
      <button class="shop-tab" data-tab="skip" data-i18n="skip">Пропуск</button>
    </div>
    <div id="shopContent"></div>
    <button class="btn ghost" id="shopClose" data-i18n="close" style="margin-top:10px">Закрыть</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="overlay">
  <div class="panel">
    <h2 data-i18n="settings">Настройки</h2>
    <div class="setting-row">
      <label data-i18n="language">Язык</label>
      <div class="setting-btns" id="langBtns">
        <button class="setting-btn" data-lang="ru">RU</button>
        <button class="setting-btn" data-lang="en">EN</button>
        <button class="setting-btn" data-lang="es">ES</button>
        <button class="setting-btn" data-lang="de">DE</button>
        <button class="setting-btn" data-lang="fr">FR</button>
      </div>
    </div>
    <div class="setting-row">
      <label data-i18n="theme">Тема</label>
      <div class="setting-btns" id="themeBtns">
        <button class="setting-btn" data-theme="neon">Neon</button>
        <button class="setting-btn" data-theme="classic">Classic</button>
      </div>
    </div>
    <div class="setting-row">
      <label data-i18n="graphics">Графика</label>
      <div class="setting-btns" id="qualityBtns">
        <button class="setting-btn" data-quality="low" data-i18n="low">Низкое</button>
        <button class="setting-btn" data-quality="medium" data-i18n="medium">Среднее</button>
        <button class="setting-btn" data-quality="high" data-i18n="high">Высокое</button>
      </div>
    </div>
    <div class="setting-row">
      <label data-i18n="sound">Звук</label>
      <div class="setting-btns">
        <button class="setting-btn" data-sound="on" data-i18n="on">Вкл</button>
        <button class="setting-btn" data-sound="off" data-i18n="off">Выкл</button>
      </div>
    </div>
    <div class="setting-row">
      <label data-i18n="shake">Тряска экрана</label>
      <div class="setting-btns">
        <button class="setting-btn" data-shake="on" data-i18n="on">Вкл</button>
        <button class="setting-btn" data-shake="off" data-i18n="off">Выкл</button>
      </div>
    </div>
    <div style="margin-top:14px">
      <button class="btn danger" id="resetBtn" data-i18n="reset">Сбросить прогресс</button>
      <button class="btn ghost" id="settingsClose" data-i18n="close" style="margin-top:6px">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';

const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;

/* ═══════════════════════════════════════════════════════════
   I18N
   ═══════════════════════════════════════════════════════════ */
const I18N = {
  ru: {
    menuSub:'30 обычных · 12 лавовых · кастомизация',
    play:'Играть', shop:'Магазин', settings:'Настройки',
    continue:'Продолжить', restart:'Начать заново', toMenu:'В меню',
    paused:'Пауза', levelComplete:'Уровень пройден!',
    allLevels:'Все уровни пройдены!', allLava:'Вся лава пройдена!',
    next:'Далее', again:'Ещё раз', close:'Закрыть',
    language:'Язык', theme:'Тема', graphics:'Графика',

  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

/* ═══════════════════════════════════════════════════════════
   SAVE/LOAD
   ═══════════════════════════════════════════════════════════ */
function normalizeProg(mode,len){
  const p = game.prog[mode];
  while(p.stars.length<len) p.stars.push(0);
  while(p.claimed.length<len) p.claimed.push(false);
  p.stars.length=len; p.claimed.length=len;
  if(p.unlocked<0) p.unlocked=0;
  if(p.unlocked>=len) p.unlocked=len-1;
}
function loadSave(){
  try{
    const s = localStorage.getItem('hookswing_settings');
    if(s){
      const o = JSON.parse(s);
      if(o && typeof o==='object'){
        if(THEMES[o.theme]) game.settings.theme = o.theme;
        if(I18N[o.lang]) game.settings.lang = o.lang;
        if(GFX[o.quality]) game.settings.quality = o.quality;
        if(typeof o.sound==='boolean') game.settings.sound = o.sound;
        if(typeof o.shake==='boolean') game.settings.shake = o.shake;
      }
    }
    const g = parseInt(localStorage.getItem('hookswing_gems'),10);
    if(!isNaN(g)&&g>=0) game.gems = g;

    const nRaw = localStorage.getItem('hookswing_prog_normal');
    if(nRaw){
      const o = JSON.parse(nRaw);
      if(o && typeof o==='object'){
        game.prog.normal.unlocked = o.unlocked||0;
        game.prog.normal.stars = Array.isArray(o.stars)?o.stars.slice():[];
        game.prog.normal.claimed = Array.isArray(o.claimed)?o.claimed.slice():[];
      }
    }
    const lRaw = localStorage.getItem('hookswing_prog_lava');
    if(lRaw){
      const o = JSON.parse(lRaw);
      if(o && typeof o==='object'){
        game.prog.lava.unlocked = o.unlocked||0;
        game.prog.lava.stars = Array.isArray(o.stars)?o.stars.slice():[];
        game.prog.lava.claimed = Array.isArray(o.claimed)?o.claimed.slice():[];
      }
    }

    const ownedRaw = localStorage.getItem('hookswing_owned');
    if(ownedRaw){
      const arr = JSON.parse(ownedRaw);
      if(Array.isArray(arr)) game.ownedTails = arr;
    }
    const tail = localStorage.getItem('hookswing_tail');
    if(tail && TAILS.some(t2=>t2.id===tail)) game.equippedTail = tail;

    const skinsRaw = localStorage.getItem('hookswing_owned_skins');
    if(skinsRaw){ const arr = JSON.parse(skinsRaw); if(Array.isArray(arr)) game.ownedSkins = arr; }
    const skin = localStorage.getItem('hookswing_skin');
    if(skin && SKINS.some(s2=>s2.id===skin)) game.equippedSkin = skin;

    const hatsRaw = localStorage.getItem('hookswing_owned_hats');
    if(hatsRaw){ const arr = JSON.parse(hatsRaw); if(Array.isArray(arr)) game.ownedHats = arr; }
    const hat = localStorage.getItem('hookswing_hat');
    if(hat && HATS.some(h2=>h2.id===hat)) game.equippedHat = hat;
  }catch(e){}

  normalizeProg('normal',LEVELS.length);
  normalizeProg('lava',LAVA_LEVELS.length);
  if(!game.ownedTails.includes('fire')) game.ownedTails.push('fire');
  if(!game.ownedTails.includes(game.equippedTail)) game.equippedTail='fire';
  if(!game.ownedSkins.includes('classic')) game.ownedSkins.push('classic');
  if(!game.ownedSkins.includes(game.equippedSkin)) game.equippedSkin='classic';
  if(!game.ownedHats.includes('none')) game.ownedHats.push('none');
  if(!game.ownedHats.includes(game.equippedHat)) game.equippedHat='none';

  applyTheme(game.settings.theme,true);
  applyLanguage(game.settings.lang,true);
}
function saveProgress(){
  try{
    localStorage.setItem('hookswing_gems',String(game.gems));
    localStorage.setItem('hookswing_prog_normal',JSON.stringify(game.prog.normal));
    localStorage.setItem('hookswing_prog_lava',JSON.stringify(game.prog.lava));
    localStorage.setItem('hookswing_owned',JSON.stringify(game.ownedTails));
    localStorage.setItem('hookswing_tail',game.equippedTail);
    localStorage.setItem('hookswing_owned_skins',JSON.stringify(game.ownedSkins));
    localStorage.setItem('hookswing_skin',game.equippedSkin);
    localStorage.setItem('hookswing_owned_hats',JSON.stringify(game.ownedHats));
    localStorage.setItem('hookswing_hat',game.equippedHat);
    localStorage.setItem('hookswing_settings',JSON.stringify(game.settings));
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   ЗВУК
   ═══════════════════════════════════════════════════════════ */
let actx = null;
function sfx(type){
  if(!game.settings.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const now = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if(type==='grab'){
      o.type='triangle'; o.frequency.setValueAtTime(760,now);
      o.frequency.exponentialRampToValueAtTime(400,now+0.08);
      g.gain.setValueAtTime(0.05,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.11);
      o.start(now); o.stop(now+0.13);
    } else if(type==='bounce'){
      o.type='sine'; o.frequency.setValueAtTime(300,now);
      o.frequency.exponentialRampToValueAtTime(900,now+0.1);
      g.gain.setValueAtTime(0.08,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.16);
      o.start(now); o.stop(now+0.18);
    } else if(type==='freeze'){
      o.type='sine'; o.frequency.setValueAtTime(1200,now);
      o.frequency.exponentialRampToValueAtTime(500,now+0.22);
      g.gain.setValueAtTime(0.045,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.25);
      o.start(now); o.stop(now+0.27);
    } else if(type==='win'){
      o.type='sine';
      [523,659,784,1046].forEach((f,i)=>o.frequency.setValueAtTime(f,now+i*0.075));
      g.gain.setValueAtTime(0.07,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.5);
      o.start(now); o.stop(now+0.52);
    } else if(type==='die'){
      o.type='sawtooth'; o.frequency.setValueAtTime(240,now);
      o.frequency.exponentialRampToValueAtTime(55,now+0.25);
      g.gain.setValueAtTime(0.05,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.27);
      o.start(now); o.stop(now+0.29);
    } else if(type==='buy'){
      o.type='sine';
      [660,880,1320].forEach((f,i)=>o.frequency.setValueAtTime(f,now+i*0.06));
      g.gain.setValueAtTime(0.06,now);
      g.gain.exponentialRampToValueAtTime(0.0008,now+0.3);
      o.start(now); o.stop(now+0.32);
    }
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   ПРИМЕНИТЬ ТЕМУ/ЯЗЫК/НАСТРОЙКИ
   ═══════════════════════════════════════════════════════════ */
function applyTheme(name,silent){
  if(!THEMES[name]) name='neon';
  game.settings.theme = name;
  theme = THEMES[name];
  document.body.className = 'theme-'+name;
  document.querySelectorAll('[data-theme]').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===name);
  });
  if(!silent) saveProgress();
}
function applyLanguage(lang,silent){
  if(!I18N[lang]) lang='ru';
  game.settings.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
  const winTitle = document.getElementById('winTitle');
  if(winTitle && winTitle.dataset.key){
    winTitle.textContent = t(winTitle.dataset.key);
  }
  if(!silent) saveProgress();
}
function applySettingsUI(){
  document.querySelectorAll('[data-quality]').forEach(b=>{
    b.classList.toggle('active', b.dataset.quality===game.settings.quality);
  });
  document.querySelectorAll('[data-sound]').forEach(b=>{
    b.classList.toggle('active', b.dataset.sound===(game.settings.sound?'on':'off'));
  });
  document.querySelectorAll('[data-shake]').forEach(b=>{
    b.classList.toggle('active', b.dataset.shake===(game.settings.shake?'on':'off'));
  });
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===game.settings.lang);
  });
  document.querySelectorAll('[data-theme]').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===game.settings.theme);
  });
}

/* ═══════════════════════════════════════════════════════════
   АНИМАЦИЯ МИРА
   ═══════════════════════════════════════════════════════════ */
function updateHookMotion(h,t){
  if(h.move){
    const ph = t*h.move.speed+(h.move.shift||0);
    if(h.move.axis==='x') h.x = h._bx+Math.sin(ph)*h.move.amp;
    else h.y = h._by+Math.sin(ph)*h.move.amp;
  }
  if(h.phase){
    const cyc = (t%h.phase.period)/h.phase.period;
    h._phase = cyc; h._active = cyc<0.62;
  } else h._active = true;
}
function updateObstacleMotion(o,t){
  if(o.move){
    const ph = t*o.move.speed+(o.move.shift||0);
    if(o.move.axis==='y') o._y = o._by+Math.sin(ph)*o.move.amp;
    else o._x = o._bx+Math.sin(ph)*o.move.amp;
  } else { o._x=o._bx; o._y=o._by; }
}
function laserOn(l,t){
  const cyc = ((t+(l.shift||0))%l.period)/l.period;
  return cyc>=l.off;
}

/* ═══════════════════════════════════════════════════════════
   ЗАХВАТ / ОТПУСКАНИЕ / ЗАМОРОЗКА / ПРОПУСК
   ═══════════════════════════════════════════════════════════ */
function findNearestHook(){
  let best=null,bestScore=Infinity,bestD=0;
  for(const h of game.level.hooks){
    if(!h._active) continue;
    if(h===lastHook && game.time-lastHookTime<0.25) continue;
    const dx=h.x-player.x, dy=h.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d<=h.radius){
      const score = d+(dx>0?0:1200);
      if(score<bestScore){bestScore=score;best=h;bestD=d;}
    }
  }
  return best?{hook:best,dist:bestD}:null;
}
function tryGrab(){
  if(player.frozen) return;
  const res = findNearestHook();
  if(!res) return;
  const h = res.hook;
  player.attached = h;
  player.ropeLen = clamp(res.dist,MIN_ROPE,MAX_ROPE);
  if(res.dist>MAX_ROPE){
    const dx=h.x-player.x, dy=h.y-player.y;
    const d = Math.max(res.dist,1);
    player.x = h.x-dx/d*MAX_ROPE;
    player.y = h.y-dy/d*MAX_ROPE;
  }
  sfx('grab');
  spawnSparks(h.x,h.y,Math.round(12*gfx().particleMul),'#ffd166');
}
function releasePlayer(){
  const a = player.attached;
  if(a){
    lastHook=a; lastHookTime=game.time;
    const ang = Math.atan2(player.y-a.y,player.x-a.x);
    const n = Math.round(7*gfx().particleMul);
    for(let i=0;i<n;i++){
      const spd = 90+Math.random()*150;
      const a2 = ang+Math.PI+(Math.random()-0.5)*1.2;
      game.particles.push({
        x:player.x,y:player.y,
        vx:Math.cos(a2)*spd+player.vx*0.25,
        vy:Math.sin(a2)*spd+player.vy*0.25,
        life:1,decay:2.4,r:1.8+Math.random()*2.2,
        color:getTail().colors[0],grav:380
      });
    }
  }
  player.attached = null;
}
function setFrozen(v){
  if(v){
    if(player.attached||player.stamina<=0.02||game.state!=='playing') return;
    if(!player.frozen){
      player.frozen = true;
      sfx('freeze');
      spawnSparks(player.x,player.y,16,'#9fe8ff');
    }
  } else if(player.frozen){
    player.frozen = false;
    spawnSparks(player.x,player.y,10,'#cfeaff');
  }
}
function attemptSkipCurrent(){
  if(game.state!=='playing') return;
  const p = prog(), levels = currentLevels(), idx = game.levelIndex;
  if(idx>=levels.length-1){ showToast(t('lastLevel')); return; }
  if((p.stars[idx]||0)>0){ showToast(t('alreadyDone')); return; }
  if(game.gems<SKIP_COST){ showToast(t('needGems')); return; }

  game.gems -= SKIP_COST;
  p.stars[idx] = Math.max(p.stars[idx]||0,1);
  p.claimed[idx] = true;
  if(idx+1>p.unlocked) p.unlocked = idx+1;
  saveProgress();
  updateGemsHud();
  sfx('buy');
  showToast(t('levelSkipped'));
  setTimeout(()=>{ if(game.state==='playing') loadLevel(idx+1); },300);
}

/* ═══════════════════════════════════════════════════════════
   ФИЗИКА
   ═══════════════════════════════════════════════════════════ */
function stepPhysics(dt){
  const p = player;
  if(p.frozen){
    p.stamina -= dt/FREEZE_DRAIN;
    if(p.stamina<=0){ p.stamina=0; setFrozen(false); }
    return;
  } else p.stamina = Math.min(1,p.stamina+dt/FREEZE_RECHARGE);

  if(pointerDown && !p.attached) tryGrab();
  const drag = Math.exp(-AIR_DRAG*dt);
  p.vx *= drag; p.vy *= drag;
  p.vy += GRAVITY*dt;
  if(p.attached){
    const sp = Math.hypot(p.vx,p.vy);
    if(sp>20 && sp<950){
      const k = PUMP/sp*dt;
      p.vx += p.vx*k; p.vy += p.vy*k;
    }
  }
  p.x += p.vx*dt; p.y += p.vy*dt;
  if(p.attached){
    const a = p.attached;
    const dx=p.x-a.x, dy=p.y-a.y, d=Math.hypot(dx,dy);
    if(d>p.ropeLen && d>0.0001){
      const nx=dx/d, ny=dy/d;
      p.x = a.x+nx*p.ropeLen;
      p.y = a.y+ny*p.ropeLen;
      const vr = p.vx*nx+p.vy*ny;
      if(vr>0){ p.vx -= vr*nx; p.vy -= vr*ny; }
    }
  }
  const sp = Math.hypot(p.vx,p.vy);
  if(sp>MAX_SPEED){ const k=MAX_SPEED/sp; p.vx*=k; p.vy*=k; }
  if(p.y>game.level.deathY) die();
}
function die(){
  if(game.state!=='playing') return;
  sfx('die');
  game.flash=1;
  if(game.settings.shake) game.shake=16;
  game.deaths++;
  spawnSparks(player.x,player.y,Math.round(26*gfx().particleMul),'#ff7a7a');
  resetPlayer(true);
}
function checkBumpers(){
  if(player.frozen||player.attached) return;
  for(const b of (game.level.bumpers||[])){
    const dx=player.x-b.x, dy=player.y-b.y, d=Math.hypot(dx,dy);
    if(d<b.r+PLAYER_R+4 && player.vy>0 && dy<0){
      player.vy = -b.power;
      player.vx += (dx/Math.max(d,1))*100;
      player.y = b.y-b.r-PLAYER_R;
      player.squash = 1;
      spawnSparks(b.x,b.y-b.r,Math.round(20*gfx().particleMul),'#a0ffd0');
      if(game.settings.shake) game.shake=9;
      sfx('bounce');
    }
  }
}
function checkObstacles(){
  if(player.frozen||game.state!=='playing') return;
  for(const o of (game.level.obstacles||[])){
    const nx=clamp(player.x,o._x,o._x+o.w), ny=clamp(player.y,o._y,o._y+o.h);
    if((player.x-nx)**2+(player.y-ny)**2<PLAYER_R*PLAYER_R){ die(); return; }
  }
}
function checkLasers(){
  if(player.frozen||game.state!=='playing') return;
  for(const l of (game.level.lasers||[])){
    if(!laserOn(l,game.time)) continue;
    const nx=clamp(player.x,l.x,l.x+l.w), ny=clamp(player.y,l.y,l.y+l.h);
    if((player.x-nx)**2+(player.y-ny)**2<PLAYER_R*PLAYER_R){ die(); return; }
  }
}
function checkGoal(){
  const g = game.level.goal;
  if(Math.hypot(player.x-g.x,player.y-g.y)<g.r){
    game.state='won'; game.winTimer=0.75;
    player.attached=null; player.frozen=false;
    sfx('win');
    spawnSparks(g.x,g.y,Math.round(40*gfx().particleMul),game.level.theme);
    game.flash=0.5;
  }
}
function updateRotation(dt){
  const p = player;
  let target;
  if(p.attached){
    const dx=p.x-p.attached.x, dy=p.y-p.attached.y;
    target = clamp(Math.atan2(-dx,dy),-2,2);
  } else target = clamp(p.vx*0.0005,-0.8,0.8);
  p.rot += (target-p.rot)*Math.min(1,dt*14);
}
function spawnSparks(x,y,count,color){
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2, spd=50+Math.random()*240;
    game.particles.push({
      x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:1,decay:1.5+Math.random()*1.5,r:1.4+Math.random()*2.6,
      color,grav:420
    });
  }
}
function updateParticles(dt){
  const arr = game.particles;
  for(let i=arr.length-1;i>=0;i--){
    const pt = arr[i];
    pt.vy += pt.grav*dt;
    const f = Math.exp(-2*dt);
    pt.vx *= f; pt.vy *= f;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.life -= pt.decay*dt;
    if(pt.life<=0) arr.splice(i,1);
  }
}
function updateCamera(dt){
  const lookX = clamp(player.vx*0.16,-190,190);
  const lookY = clamp(player.vy*0.12,-150,150);
  game.camAhead.x += (lookX-game.camAhead.x)*Math.min(1,dt*3.2);
  game.camAhead.y += (lookY-game.camAhead.y)*Math.min(1,dt*3.2);
  const tx = player.x-W*0.34+game.camAhead.x;
  const ty = player.y-H*0.50+game.camAhead.y;
  const kx = 1-Math.pow(0.0015,dt);
  const ky = 1-Math.pow(0.004,dt);
  game.cam.x += (tx-game.cam.x)*kx;
  game.cam.y += (ty-game.cam.y)*ky;
}
function updateTrail(){
  const t = game.trail;
  const sp = Math.hypot(player.vx,player.vy);
  if(sp<260||player.frozen){ if(t.length) t.shift(); return; }
  const last = t[t.length-1];
  if(!last || Math.hypot(last.x-player.x,last.y-player.y)>9){
    t.push({x:player.x,y:player.y,sp});
    if(t.length>gfx().trailMax) t.shift();
  }
}
function updateScarf(dt){
  const p = player;
  const sp = Math.hypot(p.vx,p.vy);
  const neckX = p.x+Math.sin(p.rot)*16;
  const neckY = p.y-Math.cos(p.rot)*16;
  p.scarf.unshift({x:neckX,y:neckY});
  if(p.scarf.length>12) p.scarf.pop();
  if(sp<40 && p.scarf.length>4){
    for(let i=0;i<p.scarf.length;i++){
      const k = i/p.scarf.length;
      p.scarf[i].y += (10*k)*dt*8;
    }
  }
}
function update(dt){
  if(game.state!=='playing' && game.state!=='won') return;
  const t = game.time;
  for(const h of game.level.hooks) updateHookMotion(h,t);
  for(const o of (game.level.obstacles||[])) updateObstacleMotion(o,t);
  if(player.attached && !player.attached._active){
    player.attached = null;
    spawnSparks(player.x,player.y,9,'#ff9a6e');
  }
  stepPhysics(dt);
  if(game.state==='playing'){
    checkBumpers(); checkObstacles(); checkLasers(); checkGoal();
  }
  if(game.state==='won'){
    game.winTimer -= dt;
    if(game.winTimer<=0) showWin();
  }
  player.squash = Math.max(0,player.squash-dt*3.5);
  updateRotation(dt); updateCamera(dt); updateParticles(dt);
  updateTrail(); updateScarf(dt);
  game.flash = Math.max(0,game.flash-dt*2.4);
  if(game.settings.shake) game.shake *= Math.exp(-7*dt);
  else game.shake = 0;
  updateHUD(false);
  updateFreezeButton();
}

function loadLevel(index,keepDeaths){
  const levels = currentLevels();
  game.levelIndex = clamp(index,0,levels.length-1);
  game.level = levels[game.levelIndex];
  for(const h of game.level.hooks){
    h._bx=h.x; h._by=h.y; h._active=true; h._phase=0;
    if(!h.radius) h.radius = 620;
  }
  for(const o of (game.level.obstacles||[])){
    o._bx=o.x; o._by=o.y; o._x=o.x; o._y=o.y;
  }
  lastHook=null; lastHookTime=-999;
  if(!keepDeaths) game.deaths=0;
  game.particles.length=0; game.flash=0; game.winTimer=0;
  player.frozen=false; player.stamina=1;
  resetPlayer(false);
  updateHUD(true);
  updateModeBadge();
  document.getElementById('pause').classList.remove('show');
  document.getElementById('win').classList.remove('show');
  document.getElementById('shop').classList.remove('show');
  document.getElementById('settings').classList.remove('show');
  document.getElementById('hint').textContent = game.level.hint || '';
  document.getElementById('hint').classList.remove('hide');
}
function resetPlayer(fast){
  const lv = game.level;
  player.x=lv.start.x; player.y=lv.start.y;
  player.vx=lv.start.vx||340; player.vy=0;
  player.attached=null; player.ropeLen=0; player.rot=0;
  player.frozen=false; player.squash=0;
  player.scarf.length=0; game.trail.length=0;
  const tx = player.x-W*0.30;
  const ty = player.y-H*0.52;
  if(fast){
    game.cam.x += (tx-game.cam.x)*0.5;
    game.cam.y += (ty-game.cam.y)*0.5;
  } else { game.cam.x=tx; game.cam.y=ty; }
  game.camAhead.x=0; game.camAhead.y=0;
}

   РЕНДЕР
