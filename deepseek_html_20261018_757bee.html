function render(){
  const t = game.time;
  const T = theme;
  const G = gfx();
  const isLavaMode = game.mode==='lava';

  const bg = ctx.createLinearGradient(0,0,0,H);
  if(isLavaMode){
    bg.addColorStop(0,'#1a0303'); bg.addColorStop(0.5,'#3a0808'); bg.addColorStop(1,'#501008');
  } else {
    bg.addColorStop(0,T.bgGrad[0]);
    bg.addColorStop(0.55,T.bgGrad[1]);
    bg.addColorStop(1,T.bgGrad[2]);
  }
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  if(!isLavaMode && G.nebula && T.nebula1!=='rgba(255,255,255,0)'){
    const n1x = W*0.25-game.cam.x*0.04;
    const n1y = H*0.30-game.cam.y*0.04;
    let ng = ctx.createRadialGradient(n1x,n1y,0,n1x,n1y,Math.max(W,H)*0.45);
    ng.addColorStop(0,T.nebula1); ng.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
    const n2x = W*0.80-game.cam.x*0.06;
    const n2y = H*0.70-game.cam.y*0.06;
    ng = ctx.createRadialGradient(n2x,n2y,0,n2x,n2y,Math.max(W,H)*0.40);
    ng.addColorStop(0,T.nebula2); ng.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  } else if(isLavaMode){
    const ng = ctx.createRadialGradient(W*0.5,H*0.9,0,W*0.5,H*0.9,Math.max(W,H)*0.6);
    ng.addColorStop(0,'rgba(255,80,20,0.35)');
    ng.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  }

  if(T.showStars && !isLavaMode){
    for(const s of stars){
      let x = (s.x*W-game.cam.x*s.p)%W;
      let y = (s.y*H-game.cam.y*s.p)%H;
      if(x<0) x+=W; if(y<0) y+=H;
      ctx.globalAlpha = s.a*(0.75+0.25*Math.sin(t*2+s.x*40));
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if(T.showClouds && !isLavaMode){
    for(const c of clouds){
      const cx = ((c.x*W-game.cam.x*0.04+Math.sin(t*c.speed+c.phase)*20)%(W+300))-150;
      const cy = c.y*H*0.55-game.cam.y*0.02+Math.sin(t*c.speed*1.4+c.phase)*8;
      drawCloud(cx,cy,c.scale*60);
    }
  }

  const shx = (Math.random()-0.5)*game.shake;
  const shy = (Math.random()-0.5)*game.shake;

  ctx.save();
  ctx.translate(-game.cam.x+shx,-game.cam.y+shy);

  drawHookTracks();
  drawLava(t);
  drawGoal(t);
  drawObstacles(t);
  drawLasers(t);
  drawBumpers(t);
  drawHooks(t);
  drawRope();
  drawTrail();
  drawParticles();
  drawPlayer(t);

  ctx.restore();

  if(T.vignette!=='rgba(0,0,0,0)' && !isLavaMode && G.vignette){
    const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,
                                        W/2,H/2,Math.max(W,H)*0.78);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,T.vignette);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  if(isLavaMode){
    const vg = ctx.createRadialGradient(W/2,H*0.8,Math.min(W,H)*0.2,
                                        W/2,H*0.8,Math.max(W,H)*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(40,0,0,0.55)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  if(game.flash>0.001){
    ctx.fillStyle='rgba(180,230,255,'+(game.flash*0.35)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(player.frozen){
    ctx.fillStyle = T.freezeOverlay; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = T.freezeBorder+(0.25+0.12*Math.sin(t*6))+')';
    ctx.lineWidth = 6; ctx.strokeRect(3,3,W-6,H-6);
  }
}

function drawCloud(x,y,s){
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath();
  ctx.arc(x,y,s*0.55,0,Math.PI*2);
  ctx.arc(x-s*0.45,y+s*0.08,s*0.42,0,Math.PI*2);
  ctx.arc(x+s*0.45,y+s*0.08,s*0.42,0,Math.PI*2);
  ctx.arc(x+s*0.12,y-s*0.28,s*0.40,0,Math.PI*2);
  ctx.arc(x-s*0.18,y-s*0.20,s*0.35,0,Math.PI*2);
  ctx.fill();
}
function drawHookTracks(){
  for(const h of game.level.hooks){
    if(!h.move) continue;
    ctx.beginPath();
    if(h.move.axis==='x'){
      ctx.moveTo(h._bx-h.move.amp,h._by);
      ctx.lineTo(h._bx+h.move.amp,h._by);
    } else {
      ctx.moveTo(h._bx,h._by-h.move.amp);
      ctx.lineTo(h._bx,h._by+h.move.amp);
    }
    ctx.strokeStyle = game.settings.theme==='classic'
      ? 'rgba(44,62,80,0.28)' : 'rgba(150,200,255,0.20)';
    ctx.lineWidth=2; ctx.setLineDash([4,9]);
    ctx.stroke(); ctx.setLineDash([]);
  }
}
function drawHooks(t){
  const T = theme;
  const active = player.attached;
  const nearestInfo = (!active && !player.frozen && (game.state==='playing'||game.state==='menu'))
    ? findNearestHook() : null;
  const nearest = nearestInfo?nearestInfo.hook:null;
  for(const h of game.level.hooks){
    const on = h._active;
    const isActive = h===active;
    const isNear = h===nearest;
    const pulse = 0.5+0.5*Math.sin(t*2.6+h.x*0.012);
    if((isNear||isActive) && on){
      const grd = ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.radius);
      grd.addColorStop(0, isActive?T.grabZoneActive:T.grabZone);
      grd.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(h.x,h.y,h.radius,0,Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(h.x,h.y,h.radius,0,Math.PI*2);
      ctx.strokeStyle = isActive
        ? T.grabRingActive+(0.28+pulse*0.2)+')'
        : T.grabRing+(0.24+pulse*0.22)+')';
      ctx.lineWidth=2; ctx.setLineDash([9,13]);
      ctx.lineDashOffset = -t*26;
      ctx.stroke(); ctx.setLineDash([]);
    }
    if(h.phase && on){
      const prog2 = clamp(h._phase/0.62,0,1);
      ctx.beginPath();
      ctx.arc(h.x,h.y,25,-Math.PI/2,-Math.PI/2+prog2*Math.PI*2);
      ctx.strokeStyle = game.settings.theme==='classic' ? '#e67e22' : 'rgba(255,180,110,0.9)';
      ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
    }
    ctx.globalAlpha = on?1:0.18;
    const glowColor = isActive?T.hookGlowActive:isNear?T.hookGlowNear:T.hookGlow;
    if(glowColor!=='rgba(255,255,255,0)'){
      const glow = ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,34);
      glow.addColorStop(0,glowColor);
      glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(h.x,h.y,34,0,Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(h.x,h.y,12,0,Math.PI*2);
    ctx.fillStyle = isActive?T.hookCoreActive:isNear?T.hookCoreNear:T.hookCore;
    ctx.fill();
    ctx.beginPath(); ctx.arc(h.x,h.y,12,0,Math.PI*2);
    ctx.strokeStyle = isActive?T.hookOutlineActive:T.hookOutline;
    ctx.lineWidth=2.5; ctx.stroke();
    if((isActive||isNear) && on){
      ctx.beginPath();
      ctx.arc(h.x,h.y,18+pulse*10,0,Math.PI*2);
      ctx.strokeStyle = game.settings.theme==='classic'
        ? 'rgba(230,126,34,'+(0.55-pulse*0.38)+')'
        : 'rgba(255,220,130,'+(0.5-pulse*0.38)+')';
      ctx.lineWidth=2.5; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(h.x,h.y,3.2,0,Math.PI*2);
    ctx.fillStyle = game.settings.theme==='classic'
      ? 'rgba(255,255,255,0.85)'
      : ((isActive||isNear)?'#4a3a00':'rgba(20,30,60,0.55)');
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawBumpers(t){
  const T = theme;
  for(const b of (game.level.bumpers||[])){
    const pulse = 0.5+0.5*Math.sin(t*3.5);
    const glow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.3);
    glow.addColorStop(0,T.bumperGlow+(0.30+pulse*0.14)+')');
    glow.addColorStop(1,T.bumperGlow+'0)');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*2.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    const pad = ctx.createRadialGradient(b.x,b.y-b.r*0.35,0,b.x,b.y,b.r);
    pad.addColorStop(0,T.bumperPad[0]);
    pad.addColorStop(1,T.bumperPad[1]);
    ctx.fillStyle=pad; ctx.fill();
    ctx.strokeStyle = game.settings.theme==='classic'?'rgba(0,0,0,0.4)':'rgba(255,255,255,0.7)';
    ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle=T.bumperArrow; ctx.lineWidth=5;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(b.x,b.y+b.r*0.4);
    ctx.lineTo(b.x,b.y-b.r*0.4);
    ctx.moveTo(b.x-b.r*0.32,b.y-b.r*0.06);
    ctx.lineTo(b.x,b.y-b.r*0.48);
    ctx.lineTo(b.x+b.r*0.32,b.y-b.r*0.06);
    ctx.stroke();
  }
}
function drawObstacles(t){
  const T = theme;
  for(const o of (game.level.obstacles||[])){
    const x=o._x,y=o._y,w=o.w,h=o.h;
    const pulse = 0.5+0.5*Math.sin(t*4+x*0.03);
    ctx.fillStyle=T.spikeDanger+(0.09+pulse*0.08)+')';
    ctx.fillRect(x-10,y-10,w+20,h+20);
    const grd = ctx.createLinearGradient(x,y,x+w,y);
    grd.addColorStop(0,T.spikeBody[0]);
    grd.addColorStop(0.5,T.spikeBody[1]);
    grd.addColorStop(1,T.spikeBody[2]);
    ctx.fillStyle=grd; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=T.spikeOutline; ctx.lineWidth=2;
    ctx.strokeRect(x,y,w,h);
    ctx.fillStyle=T.spikeColor;
    const sw=8,sh=12,n=Math.max(1,Math.floor(h/26));
    for(let i=0;i<n;i++){
      const sy = y+(i+0.5)*(h/n);
      ctx.beginPath();
      ctx.moveTo(x,sy-sw/2); ctx.lineTo(x-sh,sy); ctx.lineTo(x,sy+sw/2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x+w,sy-sw/2); ctx.lineTo(x+w+sh,sy); ctx.lineTo(x+w,sy+sw/2);
      ctx.closePath(); ctx.fill();
    }
  }
}
function drawLasers(t){
  const T = theme;
  for(const l of (game.level.lasers||[])){
    const on = laserOn(l,t);
    const cx = l.x+l.w/2;
    if(on){
      const grd = ctx.createLinearGradient(l.x-14,0,l.x+l.w+14,0);
      grd.addColorStop(0,T.laserGlow.replace(/[\d.]+\)$/,'0)'));
      grd.addColorStop(0.5,T.laserGlow);
      grd.addColorStop(1,T.laserGlow.replace(/[\d.]+\)$/,'0)'));
      ctx.fillStyle=grd;
      ctx.fillRect(l.x-14,l.y,l.w+28,l.h);
      ctx.fillStyle=T.laserCore;
      ctx.fillRect(cx-2.5,l.y,5,l.h);
      const p = 0.5+0.5*Math.sin(t*24);
      ctx.fillStyle=T.laserPulse+(0.35+p*0.35)+')';
      ctx.fillRect(cx-5,l.y,10,l.h);
    } else {
      ctx.strokeStyle=T.laserOff; ctx.lineWidth=2;
      ctx.setLineDash([6,12]);
      ctx.beginPath(); ctx.moveTo(cx,l.y); ctx.lineTo(cx,l.y+l.h);
      ctx.stroke(); ctx.setLineDash([]);
    }
    for(const ey of [l.y,l.y+l.h]){
      ctx.beginPath(); ctx.arc(cx,ey,7,0,Math.PI*2);
      ctx.fillStyle = on?T.laserEmitterOn:T.laserEmitterOff;
      ctx.fill();
      ctx.strokeStyle = game.settings.theme==='classic'?'rgba(0,0,0,0.4)':'rgba(255,255,255,0.35)';
      ctx.lineWidth=1.5; ctx.stroke();
    }
  }
}
function drawGoal(t){
  const g = game.level.goal;
  const T = theme;
  const themeColor = game.level.theme||'#5fffc0';
  const pulse = 0.5+0.5*Math.sin(t*3);
  if(T.goalStyle==='checkered' && game.mode!=='lava'){
    ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(44,62,80,0.35)'; ctx.lineWidth=2;
    ctx.setLineDash([12,12]); ctx.lineDashOffset = -t*30;
    ctx.stroke(); ctx.setLineDash([]);
    const innerR = 46+pulse*3;
    ctx.save();
    ctx.beginPath(); ctx.arc(g.x,g.y,innerR,0,Math.PI*2); ctx.clip();
    const size = 12;
    for(let i=-5;i<=5;i++) for(let j=-5;j<=5;j++){
      ctx.fillStyle = ((i+j)%2===0)?'#1a1a2e':'#ffffff';
      ctx.fillRect(g.x+i*size,g.y+j*size,size,size);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(g.x,g.y,innerR,0,Math.PI*2);
    ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=4; ctx.stroke();
  } else {
    const grd = ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
    grd.addColorStop(0,themeColor+'55');
    grd.addColorStop(1,themeColor+'00');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
    ctx.strokeStyle=themeColor+'66'; ctx.lineWidth=2;
    ctx.setLineDash([12,12]); ctx.lineDashOffset = -t*30;
    ctx.stroke(); ctx.setLineDash([]);
    ctx.save();
    ctx.translate(g.x,g.y); ctx.rotate(t*0.9);
    ctx.strokeStyle=themeColor; ctx.lineWidth=4;
    ctx.setLineDash([20,14]);
    ctx.beginPath(); ctx.arc(0,0,46,0,Math.PI*2); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(g.x,g.y); ctx.rotate(-t*1.4);
    ctx.strokeStyle=themeColor+'99'; ctx.lineWidth=2.5;
    ctx.setLineDash([10,16]);
    ctx.beginPath(); ctx.arc(0,0,64,0,Math.PI*2); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(g.x,g.y,12+pulse*4,0,Math.PI*2);
    ctx.fillStyle=themeColor;
    ctx.shadowColor=themeColor; ctx.shadowBlur=28;
    ctx.fill(); ctx.shadowBlur=0;
  }
}
function drawRope(){
  const a = player.attached;
  if(!a) return;
  const T = theme;
  const dx=a.x-player.x, dy=a.y-player.y, d=Math.hypot(dx,dy)||1;
  const sag = clamp((player.ropeLen-d)*0.35,0,30);
  const mx = (player.x+a.x)/2+(-dy/d)*sag;
  const my = (player.y+a.y)/2+(dx/d)*sag;
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.quadraticCurveTo(mx,my,a.x,a.y);
  ctx.strokeStyle=T.rope; ctx.lineWidth=3; ctx.lineCap='round';
  if(T.ropeGlow!=='rgba(0,0,0,0)'){
    ctx.shadowColor=T.ropeGlow; ctx.shadowBlur=14;
  }
  ctx.stroke(); ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.quadraticCurveTo(mx,my,a.x,a.y);
  ctx.strokeStyle=T.ropeInner; ctx.lineWidth=1; ctx.stroke();
}
function drawTrail(){
  const tail = getTail();
  const tr = game.trail;
  for(let i=0;i<tr.length;i++){
    const p = tr[i];
    const k = i/Math.max(tr.length,1);
    ctx.globalAlpha = k*k*0.32;
    ctx.fillStyle = tail.colors[i%tail.colors.length];
    ctx.beginPath(); ctx.arc(p.x,p.y,1.5+k*8,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawParticles(){
  for(const p of game.particles){
    ctx.globalAlpha = Math.max(0,p.life)*0.92;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ─────── ХВОСТ ─────── */
function drawTailCurve(pts,color,glow,lw,t){
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){
    const s = pts[i];
    const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
    ctx.lineTo(s.x+wav*0.4,s.y+wav*0.3);
  }
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(glow && glow!=='rgba(0,0,0,0)'){
    ctx.shadowColor=glow; ctx.shadowBlur=10;
  }
  ctx.stroke(); ctx.shadowBlur=0;
}
function drawStarShape(x,y,r,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a = (i/10)*Math.PI*2-Math.PI/2;
    const rad = i%2===0?r:r*0.42;
    const px = x+Math.cos(a)*rad, py = y+Math.sin(a)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}
function drawTail(t){
  const p = player;
  if(p.scarf.length<3) return;
  const tail = getTail();
  const pts = p.scarf;
  if(tail.style==='pixel'){
    for(let i=1;i<pts.length;i++){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      const sz = Math.max(2,6-i*0.35);
      ctx.fillStyle = tail.colors[i%tail.colors.length];
      ctx.fillRect(s.x+wav*0.4-sz/2,s.y+wav*0.3-sz/2,sz,sz);
    }
  } else if(tail.style==='stars'){
    drawTailCurve(pts,tail.colors[0],tail.glow,5,t);
    for(let i=2;i<pts.length;i+=2){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      drawStarShape(s.x+wav*0.4,s.y+wav*0.3,3,tail.colors[1]);
    }
  } else if(tail.style==='lightning'){
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const s = pts[i];
      const off = (i%2===0?1:-1)*4;
      const wob = Math.sin(t*15+i)*3;
      const x = s.x+off+wob, y = s.y;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=tail.colors[0]; ctx.lineWidth=3;
    ctx.lineCap='round';
    ctx.shadowColor=tail.glow; ctx.shadowBlur=12;
    ctx.stroke(); ctx.shadowBlur=0;
  } else if(tail.style==='rainbow'){
    for(let i=1;i<pts.length;i++){
      const s0 = pts[i-1], s1 = pts[i];
      ctx.beginPath(); ctx.moveTo(s0.x,s0.y); ctx.lineTo(s1.x,s1.y);
      ctx.strokeStyle=tail.colors[i%tail.colors.length];
      ctx.lineWidth = Math.max(2,5-i*0.18);
      ctx.lineCap='round'; ctx.stroke();
    }
  } else if(tail.style==='ghost'){
    ctx.globalAlpha = 0.55;
    drawTailCurve(pts,tail.colors[0],tail.glow,6,t);
    ctx.globalAlpha = 1;
  } else if(tail.style==='comet'){
    const grd = ctx.createLinearGradient(
      pts[pts.length-1].x,pts[pts.length-1].y,
      pts[0].x,pts[0].y);
    grd.addColorStop(0,'rgba(140,220,255,0)');
    grd.addColorStop(1,tail.colors[0]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      ctx.lineTo(s.x+wav*0.4,s.y+wav*0.3);
    }
    ctx.strokeStyle=grd; ctx.lineWidth=5;
    ctx.shadowColor=tail.glow; ctx.shadowBlur=16;
    ctx.stroke(); ctx.shadowBlur=0;
  } else if(tail.style==='ice'){
    drawTailCurve(pts,tail.colors[0],tail.glow,4,t);
    for(let i=1;i<pts.length;i+=2){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      drawStarShape(s.x+wav*0.4+4,s.y+wav*0.3,4,tail.colors[1]);
    }
  } else if(tail.style==='neon'){
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      ctx.lineTo(s.x+wav*0.4,s.y+wav*0.3);
    }
    ctx.strokeStyle=tail.colors[0]; ctx.lineWidth=5;
    ctx.shadowColor=tail.glow; ctx.shadowBlur=20;
    ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.shadowBlur=4; ctx.stroke();
    ctx.shadowBlur=0;
  } else if(tail.style==='dragon'){
    drawTailCurve(pts,tail.colors[0],tail.glow,6,t);
    for(let i=1;i<pts.length;i+=2){
      const s = pts[i];
      const wav = Math.sin(t*12-i*0.7)*(2+i*0.6);
      const bx = s.x+wav*0.4, by = s.y+wav*0.3;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.lineTo(bx+(Math.random()-0.5)*10,by-8);
      ctx.lineTo(bx+(Math.random()-0.5)*10,by+8);
      ctx.closePath();
      ctx.fillStyle=tail.colors[1]; ctx.fill();
    }
  } else {
    drawTailCurve(pts,tail.colors[0],tail.glow,5,t);
  }
}

/* ─────── ШЛЯПА ─────── */
function drawHat(t){
  const hat = getHat();
  if(hat.id==='none') return;
  const skin = getSkin();
  const G = gfx();
  ctx.save();
  ctx.translate(0,-36);
  if(hat.id==='cap'){
    ctx.fillStyle = skin.color;
    ctx.strokeStyle = skin.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0,2,11,3.5,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0,1,9,Math.PI,0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(9,2,5,2,0,0,Math.PI*2);
    ctx.fill();
  } else if(hat.id==='horns'){
    ctx.strokeStyle = '#ff4060';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,80,100,0.8)';
    ctx.shadowBlur = G.shadowBlur > 0 ? 8 : 0;
    ctx.beginPath();
    ctx.moveTo(-6,0);
    ctx.quadraticCurveTo(-11,-8,-6,-13);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(6,0);
    ctx.quadraticCurveTo(11,-8,6,-13);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else if(hat.id==='halo'){
    const pulse = Math.sin(t*3)*2;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = G.shadowBlur > 0 ? 14 : 0;
    ctx.beginPath();
    ctx.ellipse(0,-8+pulse,9,3,0,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else if(hat.id==='crown'){
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = G.shadowBlur > 0 ? 8 : 0;
    ctx.beginPath();
    ctx.moveTo(-9,2);
    ctx.lineTo(-9,-6);
    ctx.lineTo(-5,-2);
    ctx.lineTo(0,-8);
    ctx.lineTo(5,-2);
    ctx.lineTo(9,-6);
    ctx.lineTo(9,2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4060';
    ctx.beginPath();
    ctx.arc(0,-2,1.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* ─────── УЛУЧШЕННЫЙ ИГРОК ─────── */
function drawPlayer(t){
  const p = player;
  const T = theme;
  const G = gfx();
  const skin = getSkin();
  const speed = Math.hypot(p.vx,p.vy);
  const k = clamp(speed/1300,0,1);

  drawTail(t);

  const breath = speed<100 ? Math.sin(t*3)*0.025 : 0;
  let sy = 1+k*0.28+p.squash*0.35+breath;
  let sx = 1-k*0.16-p.squash*0.22-breath;
  sx = Math.max(sx,0.55); sy = Math.min(sy,1.75);

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.rot);
  ctx.scale(sx,sy);

  const lineColor = p.frozen ? T.playerFrozen : skin.color;
  const glowColor = p.frozen ? T.playerFrozenGlow : skin.glow;
  const lightSkin = isLight(p.frozen ? '#bfefff' : skin.color);
  const eyeColor = lightSkin ? '#1a1a2e' : '#ffffff';

  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle = lineColor;
  if(glowColor!=='rgba(0,0,0,0)' && G.shadowBlur>0){
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = G.shadowBlur;
  }
  ctx.lineWidth = 4;

  const swing = Math.sin(t*9);
  const swing2 = Math.sin(t*9+1.4);
  const tuck = p.attached?0.55:(p.frozen?0.15:0.35);
  const armSpread = p.attached?0.55:0.95;
  const armL = -armSpread+swing*0.22*k-tuck*0.3;
  const armR =  armSpread+swing2*0.22*k+tuck*0.3;
  const legL =  0.30+swing2*0.30*k-tuck*0.45;
  const legR = -0.30+swing*0.30*k+tuck*0.45;
  const shoulderY=-14, hipY=8;

  // ноги
  const kneeLx = Math.sin(legL)*15, kneeLy = hipY+Math.cos(legL)*15;
  const footLx = kneeLx+Math.sin(legL*0.7)*14, footLy = kneeLy+Math.cos(legL*0.7)*14;
  const kneeRx = Math.sin(legR)*15, kneeRy = hipY+Math.cos(legR)*15;
  const footRx = kneeRx+Math.sin(legR*0.7)*14, footRy = kneeRy+Math.cos(legR*0.7)*14;

  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0,hipY); ctx.lineTo(kneeLx,kneeLy); ctx.lineTo(footLx,footLy);
  ctx.moveTo(0,hipY); ctx.lineTo(kneeRx,kneeRy); ctx.lineTo(footRx,footRy);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(kneeLx,kneeLy,1.9,0,Math.PI*2);
  ctx.arc(kneeRx,kneeRy,1.9,0,Math.PI*2);
  ctx.fillStyle=lineColor; ctx.fill();

  ctx.lineWidth=3.2;
  ctx.beginPath();
  ctx.moveTo(footLx-2,footLy); ctx.lineTo(footLx+6,footLy);
  ctx.moveTo(footRx-2,footRy); ctx.lineTo(footRx+6,footRy);
  ctx.stroke();

  // торс
  ctx.lineWidth=4.6;
  ctx.beginPath(); ctx.moveTo(0,shoulderY); ctx.lineTo(0,hipY); ctx.stroke();
  ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(-6,hipY); ctx.lineTo(6,hipY); ctx.stroke();

  // плечи
  ctx.lineWidth=3.8;
  ctx.beginPath(); ctx.moveTo(-8,shoulderY); ctx.lineTo(8,shoulderY); ctx.stroke();

  // руки
  const elbowLx = Math.sin(armL)*13, elbowLy = shoulderY+Math.cos(armL)*13;
  const handLx = elbowLx+Math.sin(armL*0.55)*12, handLy = elbowLy+Math.cos(armL*0.55)*12;
  const elbowRx = Math.sin(armR)*13, elbowRy = shoulderY+Math.cos(armR)*13;
  const handRx = elbowRx+Math.sin(armR*0.55)*12, handRy = elbowRy+Math.cos(armR*0.55)*12;

  ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(0,shoulderY); ctx.lineTo(elbowLx,elbowLy); ctx.lineTo(handLx,handLy);
  ctx.moveTo(0,shoulderY); ctx.lineTo(elbowRx,elbowRy); ctx.lineTo(handRx,handRy);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(elbowLx,elbowLy,1.7,0,Math.PI*2);
  ctx.arc(elbowRx,elbowRy,1.7,0,Math.PI*2);
  ctx.fillStyle=lineColor; ctx.fill();

  ctx.beginPath();
  ctx.arc(handLx,handLy,2.5,0,Math.PI*2);
  ctx.arc(handRx,handRy,2.5,0,Math.PI*2);
  ctx.fill();

  // шея
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,shoulderY); ctx.stroke();

  // голова
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,-26,10,0,Math.PI*2); ctx.stroke();

  // глаза
  const eyeShiftX = clamp(p.vx*0.012,-2.5,2.5);
  const eyeShiftY = clamp(p.vy*0.004,-1,1);
  ctx.fillStyle=eyeColor;
  ctx.beginPath();
  ctx.arc(-3.3+eyeShiftX,-28+eyeShiftY,1.6,0,Math.PI*2);
  ctx.arc( 3.3+eyeShiftX,-28+eyeShiftY,1.6,0,Math.PI*2);
  ctx.fill();

  // улыбка
  ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.arc(eyeShiftX,-24+eyeShiftY,3.2,0.25,Math.PI-0.25);
  ctx.stroke();

  // шляпа
  drawHat(t);

  ctx.shadowBlur=0;
  ctx.restore();

  // лёд при заморозке
  if(p.frozen){
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(t*0.6);
    for(let i=0;i<5;i++){
      const a = (i/5)*Math.PI*2;
      const r = 30+Math.sin(t*3+i)*5;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      ctx.beginPath();
      ctx.moveTo(x,y-6); ctx.lineTo(x+4,y); ctx.lineTo(x,y+6); ctx.lineTo(x-4,y);
      ctx.closePath();
      ctx.fillStyle=T.frost+(0.5+0.3*Math.sin(t*5+i))+')';
      ctx.fill();
    }
    ctx.restore();
    const aura = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,60);
    aura.addColorStop(0,T.frostAura);
    aura.addColorStop(1,T.frostAura.replace(/[\d.]+\)$/,'0)'));
    ctx.fillStyle=aura;
    ctx.beginPath(); ctx.arc(p.x,p.y,60,0,Math.PI*2); ctx.fill();
  }
}

/* ─────── ЛАВА ─────── */
function drawLava(t){
  if(game.mode!=='lava') return;
  const deathY = game.level.deathY;
  const topY = deathY-100, bottomY = deathY+600;
  const waveAmp = 14, waveSpeed = 1.8;

  const glow = ctx.createLinearGradient(0,topY-300,0,topY);
  glow.addColorStop(0,'rgba(255,80,20,0)');
  glow.addColorStop(1,'rgba(255,90,20,0.35)');
  ctx.fillStyle=glow; ctx.fillRect(-6000,topY-300,12000,300);

  const grd = ctx.createLinearGradient(0,topY,0,bottomY);
  grd.addColorStop(0,'#ff8800'); grd.addColorStop(0.25,'#ff4400'); grd.addColorStop(1,'#5a0000');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(-6000,topY+Math.sin(-6000*0.008+t*waveSpeed)*waveAmp);
  for(let x=-6000;x<=6000;x+=24){
    ctx.lineTo(x,topY+Math.sin(x*0.008+t*waveSpeed)*waveAmp);
  }
  ctx.lineTo(6000,bottomY); ctx.lineTo(-6000,bottomY); ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-6000,topY+Math.sin(-6000*0.008+t*waveSpeed)*waveAmp);
  for(let x=-6000;x<=6000;x+=24){
    ctx.lineTo(x,topY+Math.sin(x*0.008+t*waveSpeed)*waveAmp);
  }
  ctx.strokeStyle='rgba(255,230,120,0.95)'; ctx.lineWidth=4;
  ctx.shadowColor='rgba(255,200,60,0.95)';
  ctx.shadowBlur = gfx().shadowBlur>0 ? 24 : 0;
  ctx.stroke(); ctx.shadowBlur=0;

  for(let i=0;i<22;i++){
    const seed = i*173;
    const bx = -3000+((seed*137)%6000)+Math.sin(t+i)*30;
    const by = topY+20+(i*41)%260;
    const r = 3+Math.abs(Math.sin(t*2+i))*4;
    ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${140+i*5},40,${0.25+Math.abs(Math.sin(t+i))*0.35})`;
    ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════════
   ПОБЕДА
   ═══════════════════════════════════════════════════════════ */
function showWin(){
  game.state='paused';
  const p = prog();
  const idx = game.levelIndex;
  const stars = game.deaths===0?3:game.deaths<=2?2:1;
  if(!p.stars[idx]||stars>p.stars[idx]) p.stars[idx]=stars;

  let gemText = '';
  if(!p.claimed[idx]){
    const reward = stars===3?20:stars===2?10:5;
    game.gems += reward;
    p.claimed[idx] = true;
    gemText = '+'+reward+' 💎';
  } else gemText = t('noGemsForLevel');

  if(idx+1>p.unlocked && idx+1<currentLevels().length) p.unlocked = idx+1;
  saveProgress(); updateGemsHud();

  const starsEl = document.getElementById('winStars');
  starsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('span');
    s.textContent = i<stars?'★':'☆';
    if(i>=stars) s.style.color='rgba(255,209,102,.25)';
    starsEl.appendChild(s);
  }
  const gemEl = document.getElementById('winGems');
  gemEl.textContent = gemText;
  gemEl.style.color = gemText.includes('+')?'var(--ui-gem)':'var(--ui-text-dim)';

  const isLast = idx>=currentLevels().length-1;
  const winTitle = document.getElementById('winTitle');
  let titleKey;
  if(isLast) titleKey = game.mode==='lava'?'allLava':'allLevels';
  else titleKey = 'levelComplete';
  winTitle.dataset.key = titleKey;
  winTitle.textContent = t(titleKey);
  document.getElementById('nextBtn').textContent = isLast?t('toMenu'):t('next');
  document.getElementById('win').classList.add('show');
}

/* ═══════════════════════════════════════════════════════════
   МЕНЮ
   ═══════════════════════════════════════════════════════════ */
function buildLevelGrid(container){
  container.innerHTML = '';
  const p = prog(), levels = currentLevels();
  for(let i=0;i<levels.length;i++){
    const b = document.createElement('button');
    const span = document.createElement('span');
    span.textContent = i+1;
    b.appendChild(span);
    const stars = p.stars[i]||0;
    if(stars>0){
      const st = document.createElement('div');
      st.className='st';
      st.textContent = '★'.repeat(stars);
      b.appendChild(st);
      b.classList.add('done');
    }
    if(i>p.unlocked) b.classList.add('locked');
    if(i===game.levelIndex) b.classList.add('cur');
    if(i<=p.unlocked){
      b.addEventListener('click', e=>{
        e.stopPropagation();
        closeAllOverlays();
        loadLevel(i);
        game.state = 'playing';
      });
    }
    container.appendChild(b);
  }
}
function closeAllOverlays(){
  ['menu','pause','win','shop','settings'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
}
function showMenu(){
  closeAllOverlays();
  game.state = 'menu';
  pointerDown = false; setFrozen(false);
  buildLevelGrid(document.getElementById('menuGrid'));
  document.getElementById('menu').classList.add('show');
  if(!game.level) loadLevel(prog().unlocked);
  game.state = 'menu';
  updateGemsHud(); updateModeBadge();
  document.querySelectorAll('.mode-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode===game.mode);
  });
}
function switchMode(mode){
  if(mode===game.mode) return;
  game.mode = mode;
  game.levelIndex = Math.min(prog().unlocked, currentLevels().length-1);
  document.querySelectorAll('.mode-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode===mode);
  });
  updateModeBadge();
  if(game.level){
    loadLevel(game.levelIndex);
    game.state = 'menu';
  }
  if(game.state==='menu') buildLevelGrid(document.getElementById('menuGrid'));
}

/* ═══════════════════════════════════════════════════════════
   МАГАЗИН
   ═══════════════════════════════════════════════════════════ */
function openShop(from){
  shopReturn = from||'menu';
  ['menu','pause','win'].forEach(id=>document.getElementById(id).classList.remove('show'));
  buildShop();
  document.getElementById('shop').classList.add('show');
}
function closeShop(){
  document.getElementById('shop').classList.remove('show');
  if(shopReturn==='pause'){
    buildLevelGrid(document.getElementById('pauseGrid'));
    document.getElementById('pause').classList.add('show');
  } else showMenu();
}
function buildShop(){
  updateGemsHud();
  document.querySelectorAll('.shop-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===shopTab);
  });
  const content = document.getElementById('shopContent');
  content.innerHTML = '';

  if(shopTab==='tails'){
    renderItemGrid(content, TAILS, 'tail');
  } else if(shopTab==='skins'){
    renderItemGrid(content, SKINS, 'skin');
  } else if(shopTab==='hats'){
    renderItemGrid(content, HATS, 'hat');
  } else {
    renderSkipTab(content);
  }
}
function renderItemGrid(container, list, type){
  const grid = document.createElement('div');
  grid.className = 'item-grid';
  const ownedList = type==='tail'?game.ownedTails:type==='skin'?game.ownedSkins:game.ownedHats;
  const equipped = type==='tail'?game.equippedTail:type==='skin'?game.equippedSkin:game.equippedHat;

  for(const item of list){
    const owned = ownedList.includes(item.id);
    const isEq = equipped===item.id;
    const el = document.createElement('div');
    el.className = 'item'+(isEq?' equipped':'');
    let bg;
    if(type==='tail') bg = `linear-gradient(135deg, ${item.colors.join(', ')})`;
    else if(type==='skin') bg = `radial-gradient(circle at 40% 40%, ${item.color}, ${item.color}dd)`;
    else bg = 'rgba(128,128,128,.25)';
    const previewIcon = type==='hat'?getHatIcon(item.id):'';

    el.innerHTML = `
      <div class="item-preview" style="background:${bg}">
        ${isEq?'<div class="item-check">✓</div>':''}
        ${previewIcon?`<div class="item-check" style="font-size:20px">${previewIcon}</div>`:''}
      </div>
      <div class="item-name">${item.name}</div>
      <div class="item-action">${owned?(isEq?t('equipped'):'→'):`${item.price} 💎`}</div>
    `;
    el.addEventListener('click', ()=>{
      if(owned){
        if(type==='tail') game.equippedTail = item.id;
        else if(type==='skin') game.equippedSkin = item.id;
        else game.equippedHat = item.id;
        saveProgress(); sfx('buy'); buildShop();
      } else {
        if(game.gems<item.price){ showToast(t('notEnough')); return; }
        game.gems -= item.price;
        if(type==='tail'){ game.ownedTails.push(item.id); game.equippedTail = item.id; }
        else if(type==='skin'){ game.ownedSkins.push(item.id); game.equippedSkin = item.id; }
        else { game.ownedHats.push(item.id); game.equippedHat = item.id; }
        saveProgress(); sfx('buy'); buildShop();
        showToast(t('bought')+': '+item.name);
      }
    });
    grid.appendChild(el);
  }
  container.appendChild(grid);
}
function getHatIcon(id){
  if(id==='cap') return '🎩';
  if(id==='horns') return '😈';
  if(id==='halo') return '😇';
  if(id==='crown') return '👑';
  return '';
}
function renderSkipTab(content){
  const p = prog(), levels = currentLevels(), idx = game.levelIndex;
  const alreadyDone = (p.stars[idx]||0)>0;
  const isLast = idx>=levels.length-1;

  const info = document.createElement('p');
  info.style.cssText = 'margin-bottom:12px;color:var(--ui-text-dim);font-size:12px';
  if(alreadyDone) info.textContent = t('alreadyDoneDesc');
  else if(isLast) info.textContent = t('lastLevelDesc');
  else info.textContent = t('skipDesc');
  content.appendChild(info);

  const grid = document.createElement('div');
  grid.className = 'skip-grid';
  const opts = [
    {stars:3,price:75,label:'3★'},
    {stars:2,price:50,label:'2★'},
    {stars:1,price:25,label:'1★'},
    {stars:0,price:100,label:'0★'}
  ];
  for(const opt of opts){
    const btn = document.createElement('button');
    btn.className = 'btn';
    const disabled = alreadyDone||isLast||game.gems<opt.price;
    if(disabled) btn.disabled = true;
    btn.innerHTML = `${opt.label} ${t('skip')}<br><small>${opt.price} 💎</small>`;
    btn.addEventListener('click', ()=>skipLevel(opt.stars, opt.price));
    grid.appendChild(btn);
  }
  content.appendChild(grid);
}
function skipLevel(stars, price){
  const p = prog(), idx = game.levelIndex;
  if(game.gems<price){ showToast(t('notEnough')); return; }
  if((p.stars[idx]||0)>0){ showToast(t('alreadyDone')); return; }
  if(idx>=currentLevels().length-1){ showToast(t('lastLevel')); return; }
  game.gems -= price;
  p.stars[idx] = Math.max(p.stars[idx]||0, stars);
  p.claimed[idx] = true;
  if(idx+1>p.unlocked) p.unlocked = idx+1;
  saveProgress(); sfx('buy'); updateGemsHud();
  if(idx+1<currentLevels().length){
    closeAllOverlays();
    loadLevel(idx+1);
    game.state = 'playing';
    showToast(t('levelSkipped'));
  } else showMenu();
}

/* ═══════════════════════════════════════════════════════════
   НАСТРОЙКИ
   ═══════════════════════════════════════════════════════════ */
function openSettings(from){
  settingsReturn = from||'menu';
  ['menu','pause','win'].forEach(id=>document.getElementById(id).classList.remove('show'));
  applySettingsUI();
  document.getElementById('settings').classList.add('show');
}
function closeSettings(){
  document.getElementById('settings').classList.remove('show');
  if(settingsReturn==='pause'){
    buildLevelGrid(document.getElementById('pauseGrid'));
    document.getElementById('pause').classList.add('show');
  } else showMenu();
}

/* ═══════════════════════════════════════════════════════════
   ВВОД
   ═══════════════════════════════════════════════════════════ */
function isUI(target){
  return target && target.closest && target.closest('button, .overlay, .setting-btn, .mode-tab, .shop-tab');
}
function pressStart(e){
  if(isUI(e && e.target)) return;
  if(game.state!=='playing') return;
  if(e && e.preventDefault) e.preventDefault();
  pointerDown = true;
  document.getElementById('hint').classList.add('hide');
}
function pressEnd(e){
  if(!pointerDown) return;
  if(e && e.preventDefault) e.preventDefault();
  pointerDown = false;
  releasePlayer();
}
window.addEventListener('pointerdown',pressStart,{passive:false});
window.addEventListener('pointerup',pressEnd,{passive:false});
window.addEventListener('pointercancel',pressEnd,{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());

elFreeze.addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation(); setFrozen(true);
},{passive:false});
window.addEventListener('pointerup',()=>setFrozen(false));
window.addEventListener('pointercancel',()=>setFrozen(false));

elSkip.addEventListener('click',e=>{
  e.stopPropagation(); attemptSkipCurrent();
});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(!e.repeat) pressStart();
  }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyF'){
    e.preventDefault();
    if(!e.repeat) setFrozen(true);
  }
  if(e.code==='KeyK'){ e.preventDefault(); attemptSkipCurrent(); }
  if(e.code==='KeyR'){ e.preventDefault(); if(game.state==='playing') loadLevel(game.levelIndex); }
  if(e.code==='Escape'){ e.preventDefault(); togglePause(); }
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp') pressEnd();
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyF') setFrozen(false);
});

/* ═══════════════════════════════════════════════════════════
   ПАУЗА
   ═══════════════════════════════════════════════════════════ */
const pauseEl = document.getElementById('pause');
const winEl = document.getElementById('win');

function togglePause(){
  if(winEl.classList.contains('show')) return;
  if(document.getElementById('shop').classList.contains('show')) return;
  if(document.getElementById('settings').classList.contains('show')) return;
  if(game.state==='playing'){
    game.state = 'paused';
    pointerDown = false; setFrozen(false);
    buildLevelGrid(document.getElementById('pauseGrid'));
    document.querySelectorAll('#pause .mode-tab').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode===game.mode);
    });
    pauseEl.classList.add('show');
  } else if(game.state==='paused'){
    closeAllOverlays();
    game.state = 'playing';
  }
}

document.getElementById('pauseBtn').addEventListener('click',e=>{
  e.stopPropagation(); togglePause();
});
pauseEl.addEventListener('click',e=>{
  const act = e.target.getAttribute && e.target.getAttribute('data-act');
  if(act==='resume') togglePause();
  if(act==='restart'){ closeAllOverlays(); loadLevel(game.levelIndex); game.state='playing'; }
  if(act==='menu'){ showMenu(); }
  if(act==='shop'){ openShop('pause'); }
  if(act==='settings'){ openSettings('pause'); }
});

document.getElementById('nextBtn').addEventListener('click',e=>{
  e.stopPropagation();
  winEl.classList.remove('show');
  const isLast = game.levelIndex>=currentLevels().length-1;
  if(isLast) showMenu();
  else { loadLevel(game.levelIndex+1); game.state='playing'; }
});
document.getElementById('againBtn').addEventListener('click',e=>{
  e.stopPropagation();
  winEl.classList.remove('show');
  loadLevel(game.levelIndex);
  game.state='playing';
});
document.getElementById('menuBtn').addEventListener('click',e=>{
  e.stopPropagation();
  winEl.classList.remove('show'); showMenu();
});
document.getElementById('shopBtnWin').addEventListener('click',e=>{
  e.stopPropagation(); openShop('menu');
});
document.getElementById('shopBtnMenu').addEventListener('click',e=>{
  e.stopPropagation(); openShop('menu');
});
document.getElementById('settingsBtnMenu').addEventListener('click',e=>{
  e.stopPropagation(); openSettings('menu');
});

document.querySelectorAll('.mode-tab').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    switchMode(b.dataset.mode);
    if(game.state==='paused') buildLevelGrid(document.getElementById('pauseGrid'));
  });
});

document.getElementById('playBtn').addEventListener('click',e=>{
  e.stopPropagation();
  const startIdx = Math.min(prog().unlocked, currentLevels().length-1);
  closeAllOverlays();
  loadLevel(startIdx);
  game.state='playing';
});

document.getElementById('shopClose').addEventListener('click',e=>{
  e.stopPropagation(); closeShop();
});
document.querySelectorAll('.shop-tab').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    shopTab = b.dataset.tab;
    buildShop();
  });
});

document.getElementById('settingsClose').addEventListener('click',e=>{
  e.stopPropagation(); closeSettings();
});
document.querySelectorAll('[data-lang]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    applyLanguage(b.dataset.lang,false);
    applySettingsUI();
  });
});
document.querySelectorAll('[data-theme]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    applyTheme(b.dataset.theme,false);
    applySettingsUI();
  });
});
document.querySelectorAll('[data-quality]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    game.settings.quality = b.dataset.quality;
    saveProgress();
    applySettingsUI();
  });
});
document.querySelectorAll('[data-sound]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    game.settings.sound = b.dataset.sound==='on';
    saveProgress();
    applySettingsUI();
  });
});
document.querySelectorAll('[data-shake]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    game.settings.shake = b.dataset.shake==='on';
    saveProgress();
    applySettingsUI();
  });
});
document.getElementById('resetBtn').addEventListener('click',e=>{
  e.stopPropagation();
  if(!confirm(t('resetConfirm'))) return;
  try{ localStorage.clear(); }catch(err){}
  location.reload();
});

/* ═══════════════════════════════════════════════════════════
   ГЛАВНЫЙ ЦИКЛ
   ═══════════════════════════════════════════════════════════ */
let lastTime = 0;
let acc = 0;

function frame(now){
  requestAnimationFrame(frame);
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  lastTime = now;
  if(dt>0.05) dt = 0.05;

  if(game.state!=='paused' && game.state!=='menu'){
    game.time += dt;
    acc += dt;
    let steps = 0;
    while(acc>=FIXED_DT && steps<8){
      update(FIXED_DT);
      acc -= FIXED_DT;
      steps++;
    }
    if(steps>=8) acc = 0;
  } else if(game.state==='menu'){
    game.time += dt*0.6;
    if(game.level){
      for(const h of game.level.hooks) updateHookMotion(h,game.time);
    }
  }

  render();
}

/* ═══════════════════════════════════════════════════════════
   СТАРТ
   ═══════════════════════════════════════════════════════════ */
resize();
loadSave();
game.levelIndex = Math.min(prog().unlocked, currentLevels().length-1);
loadLevel(game.levelIndex);
game.state = 'menu';
showMenu();
applySettingsUI();
requestAnimationFrame(frame);

})();
</script>
</body>
